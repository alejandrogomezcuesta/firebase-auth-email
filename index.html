<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web de Prueba con Firebase</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .hidden { display: none; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Mi Web de Prueba</h1>

    <div id="auth-section" class="box">
        <h2>Registrarse / Iniciar Sesión</h2>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres">
        </div>
        <button id="btn-register">Registrarse</button>
        <button id="btn-login" style="background-color: #28a745;">Iniciar Sesión</button>
    </div>

    <div id="profile-section" class="box hidden">
        <h2>Tu Perfil</h2>
        <p><strong>UID:</strong> <span id="user-uid"></span></p>
        <p><strong>Email:</strong> <span id="user-email"></span></p>
        
        <div class="form-group">
            <label>Nombre de Usuario:</label>
            <input type="text" id="username" placeholder="Tu apodo">
        </div>
        <button id="btn-save-profile">Guardar Perfil</button>
        <hr>
        <button id="btn-logout" style="background-color: #dc3545;">Cerrar Sesión</button>
    </div>

    <script type="module">
        // Importar las funciones necesarias de los SDKs de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURACIÓN DE TU PROYECTO (Pega aquí tus datos de Firebase)
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyDug1Z90AExEsRxpHpo9G24cMh417MmkqU",
            authDomain: "iesamachado-ejemplo.firebaseapp.com",
            projectId: "iesamachado-ejemplo",
            storageBucket: "iesamachado-ejemplo.firebasestorage.app",
            messagingSenderId: "249687433499",
            appId: "1:249687433499:web:c812f012d599d54904b3be",
            measurementId: "G-4424HWN56K"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elementos del DOM
        const authSection = document.getElementById('auth-section');
        const profileSection = document.getElementById('profile-section');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        
        const userUidSpan = document.getElementById('user-uid');
        const userEmailSpan = document.getElementById('user-email');

        // --- 1. REGISTRO DE USUARIOS ---
        document.getElementById('btn-register').addEventListener('click', async () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("¡Usuario registrado con éxito!");
            } catch (error) {
                alert("Error al registrarse: " + error.message);
            }
        });

        // --- 2. INICIO DE SESIÓN ---
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Error al iniciar sesión: " + error.message);
            }
        });

        // --- 3. CERRAR SESIÓN ---
        document.getElementById('btn-logout').addEventListener('click', async () => {
            try {
                await signOut(auth);
                alert("Sesión cerrada");
            } catch (error) {
                console.error(error);
            }
        });

        // --- 4. OBSERVADOR DE ESTADO (Detecta si hay un usuario conectado) ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Usuario conectado: Mostrar perfil, ocultar login
                authSection.classList.add('hidden');
                profileSection.classList.remove('hidden');
                userUidSpan.innerText = user.uid;
                userEmailSpan.innerText = user.email;

                // Buscar si ya tiene datos guardados en Firestore
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    usernameInput.value = docSnap.data().username;
                } else {
                    usernameInput.value = ""; // Limpiar si es nuevo
                }
            } else {
                // Usuario desconectado: Mostrar login, ocultar perfil
                authSection.classList.remove('hidden');
                profileSection.classList.add('hidden');
            }
        });

        // --- 5. GUARDAR DATOS DEL PERFIL EN FIRESTORE ---
        document.getElementById('btn-save-profile').addEventListener('click', async () => {
            const currentUser = auth.currentUser;
            if (currentUser) {
                try {
                    // Guarda o actualiza el documento en la colección "usuarios" con el ID del usuario
                    await setDoc(doc(db, "usuarios", currentUser.uid), {
                        username: usernameInput.value,
                        email: currentUser.email
                    });
                    alert("¡Perfil actualizado en la base de datos!");
                } catch (error) {
                    alert("Error al guardar: " + error.message);
                }
            }
        });
    </script>
</body>
</html>
